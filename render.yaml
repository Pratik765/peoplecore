services:
  # ─── 1. Backend Web Service (API Gateway + 8 Microservices) ───
  - type: web
    name: peoplecore-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

  # ─── 2. Frontend Static Site (React / Vite) ───
  - type: web
    name: peoplecore-frontend
    runtime: static
    plan: free
    rootDir: frontend/peoplecore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_GATEWAY_URL
        fromService:
          type: web
          name: peoplecore-backend
          property: host
